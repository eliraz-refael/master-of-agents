[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
thiserror = "2"
proptest = "1"
insta = { version = "1", features = ["json"] }
libc = "0.2"
tokio = { version = "1", default-features = false }
rusqlite = { version = "0.41", features = ["bundled", "backup", "hooks", "functions"] }  # held at 0.41 by rusqlite_migration 2.7
rusqlite_migration = "2.7"
sha2 = "0.10"
shell-words = "1"
toml = "1.2.1"
