# THROWAWAY PROTOTYPE: tmux config for the private moa server (tmux -L moa).
# Loaded by ./moa via `tmux -L moa -f tmux.conf`; re-apply live with
#   tmux -L moa source-file ~/private/master-of-agents/spike/moa-proto/tmux.conf
# Rule: no #(shell) segments and nothing driven by status-interval scripts. Every
# process launch costs 5-10 ms under this machine's endpoint security. Only built-in formats and user options.

# --- Personal config first ---------------------------------------------------
# -f replaces the default ~/.tmux.conf load, so pull it in explicitly (it holds
# extended-keys for Shift+Enter in Claude Code, and mouse on). moa overrides below.
source-file -q ~/.tmux.conf

# --- Terminal: true colour + keys for Ghostty ---------------------------------
set -s  default-terminal "tmux-256color"
set -s  terminal-features[20] "xterm-ghostty:RGB:extkeys:focus:clipboard:hyperlinks"
set -s  escape-time 10          # near-zero Esc delay for TUIs (0 can leak DA replies on attach)
set -s  focus-events on         # Claude Code / codex get focus in/out
set -s  extended-keys on        # Shift+Enter etc. reach the agents (also in ~/.tmux.conf)

# --- Windows and history -------------------------------------------------------
set -g  base-index 1            # agent windows start at 1 (the live master stays 0 until a renumber)
set -g  renumber-windows on     # no gaps after closing an agent window
set -g  history-limit 50000     # agent transcripts are long; applies to new panes
set -g  display-time 2000
set -g  set-titles on           # Ghostty tab/title shows the current agent
set -g  set-titles-string "moa · #W"
# Mouse: keyboard-first, but ~/.tmux.conf turns it on deliberately; leave its choice.
# set -g mouse off

# --- Bells: an agent ringing the bell shows up in the window list --------------
set -g  monitor-activity off    # agents spin constantly; activity would always be lit
set -g  monitor-bell on
set -g  bell-action any
set -g  visual-bell off

# --- Palette (dark; status bg follows the terminal background) -----------------
#   text #d8dee9  bright #eceff4  dim #8c9ab3  surface #3b4252  line #4c566a
#   blue #88c0d0  green #a3be8c  yellow #ebcb8b  orange #d08770  red #d57780

# --- Status line -----------------------------------------------------------------
# Two lines: a blank one for breathing room under the panes, then the bar. Pills are
# rounded with the Nerd Font half circles … (Ghostty ships the symbols).
set -g  status 2
set -g  status-format[0] ""
set -g  status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g  status-position bottom
set -g  status-justify left
set -g  status-interval 15      # only redraws the clock; runs nothing
set -g  status-style "bg=default,fg=#d8dee9"

# Left: the "◆ moa" pill. Blue normally, orange in the Ctrl-a key mode (its keys follow
# in a grey pill), yellow in copy mode.
set -g  status-left-length 160
set -g  status-left "#{?#{==:#{client_key_table},moa},#[fg=#d08770]#[bg=#d08770 fg=#2e3440 bold] ◆ moa #[bg=default fg=#d08770 nobold] #[fg=#3b4252]#[bg=#3b4252 fg=#eceff4] ←↑↓→ move · c console · t sessions · p big picture · g agent · z zoom · Space menu · ? help #[bg=default fg=#3b4252]   ,#{?client_prefix,#[fg=#d08770]#[bg=#d08770],#{?pane_in_mode,#[fg=#ebcb8b]#[bg=#ebcb8b],#[fg=#88c0d0]#[bg=#88c0d0]}}#[fg=#2e3440 bold] ◆ moa #[bg=default nobold]#{?client_prefix,#[fg=#d08770],#{?pane_in_mode,#[fg=#ebcb8b],#[fg=#88c0d0]}} #[fg=#8c9ab3] ^a keys   }"

# Window list: no numbers; an agent's state glyph (@moa_state, set by picture.py) and
# its name. The current window is a raised pill.
set -g  window-status-separator " "
set -g  window-status-format         " #{?#{==:#{@moa_state},waiting},#[fg=#ebcb8b]⚠ ,#{?#{==:#{@moa_state},working},#[fg=#88c0d0]◐ ,#{?#{==:#{@moa_state},idle},#[fg=#a3be8c]● ,}}}#[fg=#d8dee9]#W#{?window_zoomed_flag,#[fg=#8c9ab3] ⤢,} "
set -g  window-status-current-format "#[fg=#3b4252]#[bg=#3b4252]#{?#{==:#{@moa_state},waiting},#[fg=#ebcb8b]⚠ ,#{?#{==:#{@moa_state},working},#[fg=#88c0d0]◐ ,#{?#{==:#{@moa_state},idle},#[fg=#a3be8c]● ,}}}#[fg=#eceff4 bold]#W#{?window_zoomed_flag,#[fg=#88c0d0] ⤢,}#[bg=default fg=#3b4252 nobold]"
set -g  window-status-style          "default"
set -g  window-status-current-style  "default"
set -g  window-status-last-style     "default"
set -g  window-status-bell-style     "fg=#d57780,bold"
set -g  window-status-activity-style "fg=#ebcb8b"

# Right: moa's summary (@moa_status, set by picture.py when the brain changes) as a
# pill, yellow when someone waits on you; then the date and time.
set -g  status-right-length 80
set -g  status-right "#{?#{@moa_status},#{?#{m:*waiting*,#{@moa_status}},#[fg=#ebcb8b]#[bg=#ebcb8b fg=#2e3440 bold] #{@moa_status} #[bg=default fg=#ebcb8b nobold],#[fg=#3b4252]#[bg=#3b4252 fg=#88c0d0] #{@moa_status} #[bg=default fg=#3b4252]}  ,}#[fg=#3b4252]#[bg=#3b4252 fg=#8c9ab3] %a %d %b #[fg=#eceff4 bold]%H:%M #[bg=default fg=#3b4252 nobold] "

# --- Panes: gutters, not lines ---------------------------------------------------
# tmux can't round its pane borders, so they're blank gutters (spacing between panes)
# and moa's own panels draw rounded frames inside their panes (chrome.py), lit while
# focused. Panes without their own frame (agents, the empty agent spot) get a title
# pill in the gutter above them: @moa_label, or the window's name.
set -g  pane-border-lines spaces
set -g  pane-border-indicators off
set -g  pane-border-status top
set -g  pane-border-style        "fg=#4c566a"
set -g  pane-active-border-style "fg=#88c0d0"
set -g  pane-border-format "#{?#{@moa_framed},,#{?pane_active,#[fg=#88c0d0]#[fg=#2e3440 bg=#88c0d0 bold],#[fg=#3b4252]#[fg=#eceff4 bg=#3b4252]} #{?#{@moa_label},#{@moa_label},● #W} #{?pane_active,#[fg=#88c0d0 bg=default nobold],#[fg=#3b4252 bg=default]}#[default]}#{?window_zoomed_flag,#[fg=#8c9ab3]  zoomed · Ctrl-a z,}"

# --- Messages, menus, popups ------------------------------------------------------
set -g  message-style            "bg=#3b4252,fg=#eceff4"
set -g  message-command-style    "bg=#3b4252,fg=#88c0d0"
set -g  mode-style               "bg=#5e81ac,fg=#eceff4"
set -g  menu-style               "bg=#2e3440,fg=#d8dee9"
set -g  menu-selected-style      "bg=#5e81ac,fg=#eceff4"
set -g  menu-border-style        "fg=#88c0d0"
set -g  menu-border-lines rounded
set -g  popup-style              "bg=#2e3440,fg=#eceff4"
set -g  popup-border-style       "fg=#88c0d0"
set -g  popup-border-lines rounded

# --- Keys --------------------------------------------------------------------------
# Eliraz isn't a tmux user: everything starts from Ctrl-a (no tmux prefix), and the
# status line lists the keys while Ctrl-a is held. Ctrl-Space is taken by macOS.
# Ctrl-a then an arrow moves to the pane that way (arrows repeat without Ctrl-a for
# a moment; h j k l don't, so typing right after a move isn't eaten). Ctrl-a twice,
# or Ctrl-a Space, opens the full menu. Ctrl-a a sends a literal Ctrl-a to the app
# (screen's convention).
%hidden M="$HOME/private/master-of-agents/spike/moa-proto/moamenu"
set -g  repeat-time 700
bind -n C-a switch-client -T moa
bind -T moa c       run-shell -b "$M goto console"
bind -T moa t       run-shell -b "$M goto tree"
bind -T moa p       run-shell -b "$M goto plan"
bind -T moa g       run-shell -b "$M goto agent"
bind -T moa s       choose-tree -Zw
bind -T moa n       command-prompt -p "folder:,title:" -I "~/private/," "run-shell -b \"$M open '%1' --title '%2'\""
bind -T moa m       select-window -t moa:moa
bind -T moa 1       run-shell -b "$M layout apply cockpit"
bind -T moa 2       run-shell -b "$M layout apply focus"
bind -T moa 3       run-shell -b "$M layout apply classic"
bind -T moa r       run-shell -b "$M layout apply"
bind -T moa z       resize-pane -Z
bind -T moa [       previous-window
bind -T moa ]       next-window
bind -T moa a       send-keys C-a
bind -T moa ?       display-popup -E -w 84 -h 32 "less -R $HOME/private/master-of-agents/spike/moa-proto/help.txt"
bind -r -T moa Left  select-pane -L
bind -r -T moa Right select-pane -R
bind -r -T moa Up    select-pane -U
bind -r -T moa Down  select-pane -D
bind -T moa h        select-pane -L
bind -T moa l        select-pane -R
bind -T moa k        select-pane -U
bind -T moa j        select-pane -D
# The full menu lives in menu.tmux so Space and a second Ctrl-a share one definition.
bind -T moa Space   source-file "$HOME/private/master-of-agents/spike/moa-proto/menu.tmux"
bind -T moa C-a     source-file "$HOME/private/master-of-agents/spike/moa-proto/menu.tmux"
# tmux's prefix (Ctrl-b) Space opens the same menu, so it doesn't fall back to
# next-layout and scramble the cockpit.
bind Space source-file "$HOME/private/master-of-agents/spike/moa-proto/menu.tmux"
bind m select-window -t moa:moa
bind C run-shell -b "$M layout apply"
