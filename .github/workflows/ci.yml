name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main always finish, so every main commit
# gets a real ci result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ubuntu-24.04's apt tmux is 3.4: the minimum version moa supports.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spike parses (frozen prototype; removed with the spike)
        run: |
          python3 -m py_compile spike/moa-proto/*.py
          for f in spike/moa-proto/moa spike/moa-proto/moactl spike/master-chat/*.sh spike/master-chat/hooks/*.sh spike/master-chat/master/hooks/*.sh; do bash -n "$f"; done
      # jq and sqlite3 for the spike's forwarder tests (the image has python3)
      - run: sudo apt-get update && sudo apt-get install -y tmux jq sqlite3 && tmux -V
      # reads rust-toolchain.toml (`rustup show` stopped installing in 1.28)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A CI step, not a test: the Nix build sandbox can't run `cargo tree`.
      - name: The pure crates stay free of IO crates
        run: scripts/io-crates
      - run: cargo nextest run --workspace

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install tmux && tmux -V
      # the spike's forwarder tests need them; the image has both
      - run: jq --version && sqlite3 --version
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace

  # x86_64-linux with nixpkgs tmux (3.8). On Linux because the free plan runs only 5 macOS
  # jobs at once and each run would need two; `macos` above already builds and tests on
  # macOS, and the darwin flake outputs are evaluated below. The first run of a new cache
  # builds every crate, so it gets more time.
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: write lets main's run delete the caches it replaces.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # The Nix store (toolchain and every compiled dependency crate) is kept between runs.
      # Only main saves it, and keeps one copy; PRs restore main's and don't spend the
      # repo's 10 GB cache on their own. A new lock file or Nix file starts a new cache.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # The other systems' outputs are not built here, only evaluated, so a broken derivation
      # for them still fails CI.
      - name: Evaluate the other systems' outputs
        run: |
          for a in checks.aarch64-darwin.nextest packages.aarch64-darwin.default checks.aarch64-linux.nextest; do
            nix eval ".#$a.drvPath"
          done
      - run: nix flake check -L

  # The required check: green only if every job above succeeded.
  ci:
    if: always()
    needs: [linux, macos, nix]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.linux.result }}" "${{ needs.macos.result }}" "${{ needs.nix.result }}"; do
            [ "$r" = success ] || { echo "a required job ended with: $r"; exit 1; }
          done
