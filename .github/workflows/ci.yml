name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main always finish, so every main commit
# gets a real ci result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ubuntu-24.04's apt tmux is 3.4: the minimum version moa supports.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spike parses (frozen prototype; removed with the spike)
        run: |
          python3 -m py_compile spike/moa-proto/*.py
          for f in spike/moa-proto/moa spike/moa-proto/moactl spike/master-chat/*.sh spike/master-chat/hooks/*.sh spike/master-chat/master/hooks/*.sh; do bash -n "$f"; done
      - run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V
      # reads rust-toolchain.toml (`rustup show` stopped installing in 1.28)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A CI step, not a test: the Nix build sandbox can't run `cargo tree`.
      - name: moa-core stays free of IO crates
        run: |
          # `if`, not `! grep`: bash -e ignores a `!` command, so a line appended after
          # it would silently disable this check.
          out=$(cargo tree -p moa-core -e normal --prefix none --target all)
          if grep -E '^(tokio|rusqlite|libc) ' <<<"$out"; then
            echo "moa-core depends on an IO crate (listed above)"
            exit 1
          fi
      - run: cargo nextest run --workspace

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install tmux && tmux -V
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace

  # aarch64-darwin, the user's platform; nixpkgs tmux (3.8).
  nix:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Linux outputs are not built here, only evaluated, so a broken Linux derivation fails CI.
      - name: Evaluate the Linux outputs
        run: |
          for a in checks.x86_64-linux.nextest checks.aarch64-linux.nextest packages.x86_64-linux.default; do
            nix eval ".#$a.drvPath"
          done
      - run: nix flake check -L

  # The required check: green only if every job above succeeded.
  ci:
    if: always()
    needs: [linux, macos, nix]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.linux.result }}" "${{ needs.macos.result }}" "${{ needs.nix.result }}"; do
            [ "$r" = success ] || { echo "a required job ended with: $r"; exit 1; }
          done
