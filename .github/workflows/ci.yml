name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The required status check. It grows with the code: today it only checks that the
  # prototype's scripts parse; the Rust implementation will add build and tests here.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python parses
        run: python3 -m py_compile spike/moa-proto/*.py
      - name: Shell scripts parse
        run: |
          for f in spike/moa-proto/moa spike/moa-proto/moactl spike/master-chat/*.sh spike/master-chat/hooks/*.sh spike/master-chat/master/hooks/*.sh; do
            bash -n "$f"
          done
