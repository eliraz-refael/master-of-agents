[package]
name = "moa-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
moa-core = { path = "../moa-core" }
serde_json.workspace = true
agent-client-protocol = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
moa-platform = { path = "../moa-platform", optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "io-util", "process", "sync", "time"] }
tokio-util = { workspace = true, optional = true, features = ["compat"] }
tracing = { workspace = true, optional = true }

[features]
acp = [
    "dep:agent-client-protocol",
    "dep:libc",
    "dep:moa-platform",
    "dep:serde",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
]

[dev-dependencies]
insta.workspace = true
moa-testkit = { path = "../moa-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[[test]]
name = "acp_check"
required-features = ["acp"]

[[test]]
name = "acp_host"
required-features = ["acp"]

[lints]
workspace = true
