[package]
name = "moa-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-client-protocol.workspace = true
moa-agents = { path = "../moa-agents", features = ["acp"] }
moa-core = { path = "../moa-core" }
moa-platform = { path = "../moa-platform" }
jiff.workspace = true
moa-store = { path = "../moa-store" }
proptest.workspace = true
rusqlite.workspace = true
rustix = { version = "1", features = ["pty", "termios", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util", "process", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "stub-acp"
path = "src/bin/stub-acp.rs"

[lints]
workspace = true
